allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    // Lets IntelliJ IDEA "Build and run using IntelliJ IDEA" share Gradle's output folders.
    idea {
        module {
            outputDir = file('build/classes/java/main')
            testOutputDir = file('build/classes/java/test')
        }
    }
}

subprojects {
    version = projectVersion
    ext.appName = 'Backgammon'

    repositories {
        mavenCentral()
        google()
    }
}

// Plain Java modules (the Android module configures Java through the Android Gradle Plugin).
// Read once here: inside the java {} and task closures the name `javaVersion` resolves to Gradle's own properties.
def javaLevel = providers.gradleProperty('javaVersion').get().toInteger()

configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.toVersion(javaLevel)
        targetCompatibility = JavaVersion.toVersion(javaLevel)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaLevel
        options.incremental = true
    }
}

eclipse.project.name = 'Backgammon-parent'
