buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$androidPluginVersion"
    }
}

apply plugin: 'com.android.application'

android {
    namespace = 'si.um.feri.backgammon'
    compileSdk = 36

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs(['src/main/java'])
            res.setSrcDirs(['res'])
            assets.setSrcDirs(['../assets'])
            jniLibs.setSrcDirs(['libs'])
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                         'META-INF/dependencies.txt', '**/*.gwt.xml']
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                           'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
        }
    }

    defaultConfig {
        applicationId = 'si.um.feri.backgammon'
        minSdk = 21
        targetSdk = 36
        versionCode = 2
        versionName = projectVersion
    }

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(providers.gradleProperty('javaVersion').get())
        targetCompatibility = JavaVersion.toVersion(providers.gradleProperty('javaVersion').get())
        coreLibraryDesugaringEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations { natives }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$androidDesugaringVersion"
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Extracts the native libraries from the "natives" configuration into libs/<abi>/ so they get packed into the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi -> file("libs/$abi/").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("libs/$abi")
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}

// Starts the installed app on a connected device: gradlew android:run
tasks.register('run', Exec) {
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def localProperties = rootProject.file('local.properties')
    if (localProperties.exists()) {
        def properties = new Properties()
        localProperties.withInputStream { properties.load(it) }
        sdkDir = properties.getProperty('sdk.dir') ?: sdkDir
    }
    commandLine "$sdkDir/platform-tools/adb", 'shell', 'am', 'start', '-n',
            'si.um.feri.backgammon/si.um.feri.backgammon.AndroidLauncher'
}

eclipse.project.name = appName + '-android'
