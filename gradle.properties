org.gradle.daemon=true
org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# "Configure on demand" must stay off: it breaks builds that contain an Android module.
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableR8.fullMode=false

projectVersion=1.1.0
# Java language level of the compiled code. Building requires JDK 17+ (JDK 21 recommended).
javaVersion=17

gdxVersion=1.14.2
# libGDX 1.14.2 declares LWJGL 3.3.3; 3.4.3 avoids warnings and restrictions on Java 24+.
lwjgl3Version=3.4.3
androidPluginVersion=8.9.3
androidDesugaringVersion=2.1.5
junitVersion=6.1.3
